name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout latest tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          latest_tag=$(git describe --tags --abbrev=0)
          git checkout $latest_tag

      - name: Set Image Tag Suffix
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Regulärer Release bekommt kein Suffix (bzw. ist leer)
            echo "IMAGE_TAG_SUFFIX=" >> $GITHUB_ENV
          else
            # CVE-Patches bekommen das aktuelle Datum angehängt (z.B. -patch-20260912)
            echo "IMAGE_TAG_SUFFIX=-patch-$(date +'%Y%m%d')" >> $GITHUB_ENV
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: true

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
